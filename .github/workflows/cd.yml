name: CI - Validação para publicação Lovable

on:
  push:
    branches:
      - main
      - develop
      - 'codex/**'
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: validacao-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validar:
    name: Validar código antes da publicação
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validar tipos
        run: npm run typecheck

      - name: Executar testes
        run: npm run test

      - name: Gerar build
        run: npm run build
