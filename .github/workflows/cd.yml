name: CD - Multi-Environment Deployment

on:
  push:
    branches:
      - develop # Deploy para DEV/HML
      - main    # Deploy para PROD (exige aprovação de Environment)

jobs:
  deploy-staging:
    name: Deploy to Staging / DEV
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.industrial-saas.local
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Staging Artifact
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}
          VITE_APP_ENV: staging
        run: npm run build

      - name: Verify Staging Artifact
        run: ls -la dist/

  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.industrial-saas.local
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Artifact
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
          VITE_APP_ENV: production
        run: npm run build

      - name: Verify Production Artifact
        run: ls -la dist/
